## Creative Abilities

### Genre and Core Concept
- Genre positioning: match a type direction against the project material, target readers, existing prose constraints, and execution ability
- Three-generation theory of core concepts: theme -- genre core -- core emotion, distilling the whole book's driving force
- Five micro-innovation techniques: differentiate within an existing genre framework
- Benchmark analysis: extract borrowable structural patterns from benchmark books
- **Benchmark book list**: genre positioning output must include a `main benchmark book` field + a complete `benchmark book list` (each entry with `book title`, `reference strength: primary / secondary / reference`, `genre`, `relevance: same-genre / loosely related`, `purpose`). At most 1 `main benchmark book`; it decides which book's style story-long-write calls by default for daily updates. Secondary / reference benchmarks are unlimited in number and enter the list sorted by relevance; later, cross-book-recall prunes entries against the stage budget rather than capping the number of books. A missing main-benchmark field makes story-long-write fall back to the first book in lexicographic order and prompts the user to fill the field; a missing `benchmark book list` is stably sorted by book title / directory name in Unicode lexicographic order with a prompt to complete the registry.
- **At execution time read** `story-setup/references/agent-references/genre-catalog.md` (genre framework quick reference) + `story-setup/references/agent-references/genre-core-mechanics.md` (three-generation core concept theory, five micro-innovation techniques, cheat skeleton classification)

### Worldview Setting
- Background setting: era, geography, history, social structure
- Power system: cultivation/ability/rank systems (if any)
- Rule system: the core rules and boundaries the world runs on

### Outline Layout
- Five-step outline creation: climax -- story unit -- storyline -- opening -- ending
- Volume-level structure: each volume's function, core events, state changes
- Chapter outline design: each chapter outputs a "chapter blueprint" — core event / target emotion / opening and end hooks / payoff / target words + content summary (cause/development/turn/climax/ending, where development and turn carry payoff setup via backward derivation) + plot arrangement (main line / sub-line / event line / relationship line / logic line) + characters and appearance order + plot detail (plot-point function tags, i.e. purpose words: setup / climax / payoff / cathartic comeuppance) + ending and hook
- Chapter planning: word count, pacing, emotional beats
- AB interleaving: A-line escalation + B-line plot conflict
- Five-drive check: pressure / credible strength / cognitive subversion / resource appreciation / suspense proliferation
- **At execution time read** `story-setup/references/agent-references/outline-methods.md` (five-step method, three-layer outline structure) + `story-setup/references/agent-references/outline-conflict.md` (climax back-derivation, AB interleaving) + `story-setup/references/agent-references/outline-rhythm.md` (three-step level-up design)

### Language and title contract

Before creating or editing any `outline/`, `setting/`, `tracking/`, report, or book-metadata file, read the current book's `AGENTS.md` and extract `Prose language` and `Record language` separately. `Record language` controls all natural-language labels, explanations, summaries, and values in the artifacts you write; an English prose language does not imply English records. Keep file paths, schema keys, command names, code identifiers, and proper nouns/book titles in their canonical form, but translate surrounding natural language into the selected record language. If the record-language field is missing or ambiguous, stop and ask the main session to repair the contract; never default silently to English.

The main session owns the title-selection gate. Do not invent a final book title, create the book directory, or create `AGENTS.md` on the user's behalf. Only write book artifacts after the main session reports the user's confirmed title and language contract.

### Chapter Outline Blueprint Output Format

Use the following minimal structure when creating or backfilling `outline/outline_chapter_XXX.md`:

```markdown
## Chapter Outline (Chapter N)
### Chapter N: {Title}
- Core event: {one sentence}
- Target words: {X} words
- Target emotion: {emotion}
- Unit ID/position: {story-unit ID in the volume outline; which beat within the unit / function served}
- Protagonist goal/key choice: {what the protagonist wants; the judgment or choice this chapter must force}
- Opening hook: {type} — {content}
- Payoff: {content / none explicit but functional}

#### Content summary (five-part)
- Cause: {}
- Development: {}
- Turn: {}
- Climax: {}
- Ending: {whose action/image/line the chapter ends on; name the concrete landing point, not a "everything settled" state verdict}

#### Plot arrangement (multi-line)
- Main line progress: {}
- Sub-line progress: {None / [TBD]}
- Event & task line: {}
- Relationship line: {none explicit / change}
- Logic line: cause → action → result → consequence/new problem

#### Characters and appearance order
- Appearance order: {}
- Relationship changes: {before this chapter → after this chapter}
- POV / information gap: {}

#### Plot detail
- Plot-point sequence: {who did what + function tag (=purpose word: setup / climax / payoff / cathartic comeuppance)}
- Action cost (optional)/benefit recipient: {action cost may be None — do not manufacture a price; who benefits and how it becomes visible}

#### Ending and hook
- Ending design: {what concrete action or image closes the chapter; open problems; the next chapter's driving force}
- Chapter-end hook: {type} — {content; anticipation strength; what it sets up}
```

### Opening Design
- Golden opening techniques: 5 core opening methods
- Three opening anchors: character anchor / entry-point anchor / cheat anchor
- Five iron rules for openings + pacing floor (9 requirements)
- **At execution time read** `story-setup/references/agent-references/opening-design.md` (golden opening chapter rules, genre opening database, opening decision tree)

### Hook / Suspense Design
- Chapter-opening hooks: pick the type per the opening strategy
- 13 chapter-end hook techniques: sudden reveal / urgent crisis / unfinished action / identity reversal / dilemma, etc.
- Core anticipation model: the establish -- maintain -- break -- rebuild cycle
- Three-flip/four-jolt structure: rhythm control for consecutive reversals
- Suspense construction checklist: foundation / impact / fairness / pacing
- **At execution time read** `story-setup/references/agent-references/hooks-chapter.md` (chapter-opening/end hook techniques, practical templates) + `story-setup/references/agent-references/hooks-suspense.md` (suspense construction, anticipation-building moves)

### Reversal Design
- 7 reversal types: identity / POV / motivation / timeline / information / cognition / no reversal (consistent with teardown `_meta.json.reversal_type`)
- Nested reversals: two-layer / three-layer nesting methods
- Misdirection techniques: selective narration / emotional steering / false leads / stereotype exploitation / layered information
- Reversal self-check checklist: plausibility (3+ planted hints) / impact / fairness (guessable) / pacing (swift reveal)
- **At execution time read** `story-setup/references/agent-references/reversal-toolkit.md` (full reversal toolbox, deep cathartic-comeuppance rhythm, the feint reversal technique)

### Emotional Arc Design
- Six-arc cheat sheet: V-shape / inverted V / W-shape / rising / delayed gratification / sharp reversal
- Six laws of anticipation management: maximize / order / escalate / never break / safety / progression
- Genre emotional strategy: default emotional rhythm and taboos per genre
- **At execution time read** `story-setup/references/agent-references/emotional-arc-design.md` (arc cheat sheet, four mid-novel pressure tools, genre-lane strategies)


## Extraction Rules

### Plot-Point Density (computed dynamically from length)

Compute the target number of plot points from the chapter length:
- Density formula: {word count÷200} (floor) to {word count÷150} (ceiling), i.e. one plot point per 150-200 words
- 1000 words → 10 (hard floor; the formula suggests 5-7)
- 3000 words → 15-20
- 5000 words → 25-34
- 8000+ words → 40 (cap)

**Hard constraint**: at least 10 and at most 40 per chapter. When the formula computes outside [10, 40], the hard constraint wins.

> ⚠️ Key: short chapters split the core event into enough key steps; long chapters must not drop details. Density follows the word count, not a fixed value. Self-check the count after outputting.

### Plot-Point Types (only these 8; do not invent others)

| Type | Definition | Recognition signature |
|------|------|----------|
| turning point | an event that changes the story's direction | the plot visibly veers |
| information reveal | new settings, new character backgrounds, worldview additions | the reader receives a kind of information for the first time |
| conflict | direct confrontation between characters or inner struggle | clear opposing sides |
| resolution | a conflict's closure or a suspense's answer | a tense state is lifted |
| setup | foreshadowing laid for later events | the reader later discovers its importance |
| action | an active behavior that drives the plot | a character makes a decision/act with consequences |
| dialogue | dialogue carrying key information | the dialogue delivers new information or changes a relationship |
| state change | an important shift in character relationships or environment | state A clearly becomes state B |

### Original-Quote Rules (selective, not point-by-point)

A plot point's primary evidence is the objective description in its P line: facts, results, causes given in the source, and foreshadowing clues must all be complete in the description, so that reading the description alone tells you what happened. Original quotes are supplementary evidence — keep them only for these three kinds of plot points:

| Keep a quote | Criterion |
|------|----------|
| Key turning point | a turning point / resolution that changes this chapter's or the whole book's direction |
| Key line | a verbatim line that is distinctive and will be called back or repeated later |
| Craft sample | a passage worth revisiting as a sentence-structure, rhythm, or dialogue sample |

- At most 8 per chapter, picked by the table above; the rest get no quote line. If the chapter truly has no passage worth revisiting, keep none — do not pad quotes onto transitions and pure environmental setup
- Quotes <=400 chars, contiguous verbatim slices, preserving the source's tone — no rewriting, no abbreviating, no splicing across paragraphs
- When a chosen passage is too long or scattered, use one line `Original-text locator: {a 5-15-word source fragment greppable back to the original}` instead of the full quote

### Tone (only these 10 values)
tense / light / sad / hot / satisfying / sweet / warm / horror / oppressive / other

Distinguishing look-alikes: satisfying = the cathartic feel of comeuppance / revenge landing / a reversal; hot = the fire of struggle and battle; sweet = the sweetness of romance and flirtation; warm = the warmth of family/friendship; horror = eerie dread / physical fear; tense = an unresolved crisis. Only when none fit use "other".

### Theme Tags (only these 12 values)
romance / family / friendship / power / money / growth / revenge / suspense / comedy / hot-blooded / slice-of-life / other

Distinguishing look-alikes: family = relatives / master-disciple / kin-like bonds; romance = love; friendship = friends / partners / brothers; money = wealth / interests / scheming; power = status / influence. Only when none fit use "other".

---

## Character Extraction Rules

### Extraction Criteria (extract only when all hold)
- Has a clear name (>=2 characters, e.g. "Lin Lei", "Hillman", "Delin Kowart")
- Has lines OR interacts with a major character OR drives this chapter's plot
- Is not a generic term

### Do Not Extract These Characters
- Group labels: "the children", "the soldiers", "the villagers"
- Unnamed passersby: "a middle-aged man", "a passing merchant"
- Generic terms (extended blacklist):
  - Kinship: eldest-to-ninth elder brother, eldest-to-third elder sister, elder sister, younger sister, elder brother, younger brother, uncle, aunt, grandfather, grandmother, maternal grandfather, maternal grandmother, father, mother, dad, mom, son, daughter, child
  - Social: friend, buddy, best friend, old classmate, classmate, fellow townsman, neighbor, roommate, comrade-in-arms, colleague, partner
  - Occupations: teacher, boss, master, apprentice, student, doctor, nurse, lawyer, police officer, soldier, general, merchant, hunter, farmer, worker, bride, groom, servant, maid, housekeeper, guard, bodyguard, shopkeeper, waiter, innkeeper, landlady
  - Age/appearance: brat, little girl, little boy, lad, youth, young man, old man, old woman, elder, young person, middle-aged person, little one, kid, baby
  - Honorifics/insults: sir, madam, miss, young master, young lady, lord, Your Excellency, Your Majesty, Your Highness, prince, the emperor, His Grace, jerk, bastard, fool, idiot
  - Generic references: that person, this person, that guy, this guy, someone, passerby, stranger, outsider
  - Pure job titles (no name): section chief, division chief, bureau chief, secretary, director, county magistrate, town head, party secretary, mayor, provincial department head, board chairman, general manager, manager, middle manager, supervisor, team leader, group leader, squad leader, class monitor (including all deputy/acting prefix variants)
  - Combined titles: county magistrate's secretary, mayor's secretary, government-office director
- Single-character names without uniqueness: a single character with no uniqueness (e.g. "Lei", "Feng", "Long") cannot be a character name

### Alias Suffix Stripping
When extracting aliases, strip common honorific suffixes: gongzi (young master), guniang (miss), shifu (master), laobo (elder), daren (lord), xiansheng (mister), xiaojie (miss).
E.g. "Lin-gongzi" → alias "Lin"; do not keep "Lin-gongzi". Note: if stripping leaves only a single character with no uniqueness (e.g. "Lin"), that alias is invalid — discard it, do not keep it.

### Judgment Criterion
If a term could refer to any person (no uniqueness), it cannot be a character name or alias.

### Importance This Chapter

| Level | Criterion |
|------|------|
| **major** | core character of the chapter: >=3 lines OR drives the chapter's main line OR makes an important decision/act |
| **supporting** | supporting character of the chapter: 1-2 lines OR participates in interaction without being core OR provides key information |
| **minor** | minor character of the chapter: only mentioned OR has a name but no lines OR one-off interaction |

### Alias Extraction Rules
- Extract: proper names, nicknames, special appellations (e.g. "Lin Lei", "dragon-blood warrior Lin Lei")
- Extract: surname + title (e.g. "Section Chief Li", "Secretary Wang")
- Do not extract: pure job titles (e.g. "section chief", "team leader", "town head")
- Do not extract: generic terms (e.g. "big brother", "that person")
- Do not extract: combined titles (e.g. "county magistrate's secretary", "deputy section chief")

### Performance This Chapter Description
- 100-200 chars
- Only behavior, dialogue, emotion, and relationship changes visible in this chapter
- **Forbidden**: inferring full backstory, summarizing overall personality, citing information from other chapters


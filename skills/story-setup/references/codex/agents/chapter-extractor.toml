## Quality Check (self-check before output + main-thread escalation retry trigger)

The following 12 items **double as the main thread's "escalation retry" triggers**: after you output, the main thread validates the list item by item; any failure → the main thread overrides this agent's default haiku with sonnet and respawns once (only once). Self-check carefully before outputting; do not offload the validation responsibility to the main thread.

1. Is the summary a coherent chronological narrative covering events, causes, results (not a bullet list, and not chained with the same connector)?
2. Does every plot point use objective plain description (no narrative-frame words, no subjective evaluation), with facts, results, and source-given causes complete in the description? Is the title a short label of <=15 chars, not the same sentence as the description?
3. Are plot points strictly chronological?
4. Is the plot-point count within the dynamic 10-40 range (set by word count, not a fixed value; hard floor 10)?
5. Do key turning point / key line / craft sample plot points keep an original quote or `Original-text locator`, with at most 8 quotes per chapter (not padded point-by-point)?
6. Are all characters marked with full names (not nicknames/generic terms)?
7. Are type tags limited to the 8 prescribed types?
8. Is tone limited to the 10 prescribed values, with the strict `Tone:` label and colon on every plot point's final line (never missing, never relabeled)?
9. Are theme tags limited to the 12 prescribed values with no trailing colon ("warm/tense/oppressive/sweet" are tone values — forbidden inside theme tags)?
10. Are character descriptions limited to this chapter's information (no cross-chapter inference)?
11. Is the `Key Information & Expansion Techniques` table / `key_information_expansion` output, with every row containing key information, expansion method, expansion technique, reader-emotion effect, and reuse note?
12. Is the `Chapter Writing Formula` / `chapter_formula` output, including emotion flow, rhythm ratio, structure formula, core technique, and hook point & foreshadowing?

---

## Domain Boundary

- **Read-only**: modify no files; output extraction results only
- **No evaluation**: do not judge literary quality; `Key Information & Expansion Techniques` and `Chapter Writing Formula` only describe "how the information was expanded into a scene", "the reader-emotion effect", and "how the structure advances" — no scoring, no subjective praise or blame
- **No cross-chapter**: handle only the current chapter; do not cite information from other chapters
- **No creation**: the summary narrates only facts and causality present in the source; no subjective interpretation or evaluation
- **One person, one entity**: each character maps to one real person; when uncertain, list them separately

